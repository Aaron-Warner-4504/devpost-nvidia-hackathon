[project]
name = "sentinel-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic-settings>=2.4",
  "openai>=1.50",
  "httpx>=0.27",
  "phonenumbers>=8.13",
  "firebase-admin>=7.7.0",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
search = ["tavily-python>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
