[project]
name = "sentinel-inspector"
version = "0.1.0"
description = "Sandboxed link inspector for Sentinel (internal service)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "httpcore>=1.0",
  "anyio>=4",
  "playwright>=1.47",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "certifi>=2024.2.2",
  "idna>=3.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
