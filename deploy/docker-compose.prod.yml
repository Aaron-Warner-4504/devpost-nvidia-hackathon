# Production stack: caddy (HTTPS) -> api -> db, api -> inspector (sandboxed link fetcher).
# Run from the repository root:
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
# (--env-file feeds the ${...} interpolation below; the api also receives the file via env_file)
# Secrets live only in deploy/.env.prod (gitignored; see .env.prod.example). Only caddy publishes ports.
name: sentinel

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    # no `ports:`: reachable only by the api on the internal `data` network

  api:
    build:
      context: ../backend
      target: prod
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sentinel}
      ENVIRONMENT: prod
      FAMILY_CODE_PEPPER: ${FAMILY_CODE_PEPPER:?set FAMILY_CODE_PEPPER (>= 16 chars) in deploy/.env.prod}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_COUNT: "1"
      INSPECTOR_URL: http://inspector:8080
      INSPECTOR_SECRET: ${INSPECTOR_SECRET:?set INSPECTOR_SECRET (>= 16 chars) in deploy/.env.prod}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
    expose: ["8000"]
    networks: [data, edge, inspector_net]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # To enable family / own-device push, mount the Firebase service-account JSON read-only and set
    # FIREBASE_CREDENTIALS_FILE=/run/secrets/firebase.json in .env.prod:
    # volumes: ["./firebase.json:/run/secrets/firebase.json:ro"]

  # Sandboxed link inspector (fetches attacker-supplied URLs). Same hardening and networks as
  # backend/docker-compose.yml: internal link to the api only, own egress network, not on `data`.
  # Also apply the host egress firewall in deploy/README.md (the compose network alone does not stop it
  # reaching RFC1918 / link-local / cloud-metadata addresses).
  inspector:
    build: ../inspector
    restart: unless-stopped
    # deliberately NO env_file: it fetches attacker-controlled pages and must not see the DB password,
    # the LLM key or any other secret
    environment:
      INSPECTOR_SECRET: ${INSPECTOR_SECRET:?set INSPECTOR_SECRET in deploy/.env.prod}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
    expose: ["8080"]
    networks: [inspector_net, inspector_egress]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (public DNS name) in deploy/.env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  data:
    internal: true  # db <-> api only, no internet
  edge: {}          # caddy <-> api (api needs outbound access to Token Factory / Tavily)
  inspector_net:
    internal: true  # api -> inspector only
  inspector_egress: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
