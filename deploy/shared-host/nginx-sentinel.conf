# Sentinel under https://interns.enthral.ai/sentinel/
#
# INCLUDE THIS FILE INSIDE the existing `server { ... }` block for interns.enthral.ai, e.g.
#     server {
#         server_name interns.enthral.ai;
#         ...existing config, untouched...
#         include /opt/sentinel/app/deploy/shared-host/nginx-sentinel.conf;   # <- the only line you add
#     }
# It only defines prefix locations (/sentinel and /sentinel/...), so it cannot shadow the existing app's
# own locations unless that app already serves a /sentinel path (check: grep -rn sentinel /etc/nginx).
# TLS, listen ports, certificates and every existing location stay exactly as they are.
#
# Test before reloading:   sudo nginx -t   then   sudo systemctl reload nginx   (graceful, no dropped connections)
# Rollback: delete the include line, sudo nginx -t, sudo systemctl reload nginx.

# Bare "/sentinel" -> "/sentinel/" so relative URLs (and the app's base URL) resolve under the prefix.
# An exact-match location wins over the prefix location below.
location = /sentinel {
    return 301 /sentinel/;
}

location /sentinel/ {
    # TRAILING SLASH on proxy_pass makes nginx replace the matched "/sentinel/" with "/" , i.e. it strips the
    # prefix: /sentinel/v1/check -> http://127.0.0.1:8100/v1/check. (Do not add a URI in a variable here.)
    # 127.0.0.1:8100 is the api's loopback-only published port (SENTINEL_HOST_PORT in the compose file).
    proxy_pass http://127.0.0.1:8100/;

    # Keep-alive capable upstream protocol; also required for chunked request bodies.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # REPLACE, do not append ($proxy_add_x_forwarded_for would keep a client-forged header). The api runs with
    # TRUST_PROXY_HEADERS=true / TRUSTED_PROXY_COUNT=1 and trusts the RIGHT-MOST entry, which must be the
    # address nginx actually saw. A client-supplied X-Forwarded-For is overwritten here and never reaches the app.
    # (If another proxy/CDN sits in front of this nginx, $remote_addr is that proxy: see README troubleshooting.)
    proxy_set_header X-Forwarded-For   $remote_addr;
    # Do not forward headers the app does not use / that a client could spoof.
    proxy_set_header X-Real-IP         "";
    proxy_set_header Forwarded         "";

    # Screenshots are capped at 5 MB by the API; 6m leaves room for multipart overhead. Scoped to this
    # location only, so the neighbouring app's own limit is unchanged.
    client_max_body_size 6m;

    # Fail fast if the api is down (nginx then answers 502) instead of tying up workers.
    proxy_connect_timeout 5s;
    # Checks can call an LLM / the inspector; 60 s is above the app's own timeouts.
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Buffer the upstream response so a slow mobile client does not hold an api worker open.
    proxy_buffering on;

    # Redirects the app might emit (e.g. trailing-slash redirects) get the public prefix back.
    proxy_redirect ~^/(.*)$ /sentinel/$1;

    # Hide upstream fingerprinting headers (uvicorn). `proxy_hide_header` only affects this location.
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Security headers. `always` also sets them on error responses. Only add a header here if the
    # enclosing server block does not already add the same one (nginx would send duplicates).
    # NOTE: add_header in a location REPLACES add_header directives inherited from the server block for
    # this location only; the existing app's locations are not affected. HSTS is intentionally not set
    # here: the neighbour's server block owns the policy for the whole domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
}

# /sentinel/dashboard (demo UI) is intentionally NOT special-cased: it falls under `location /sentinel/` and is
# gated by the app itself (DEMO_ENABLED=false in the compose file -> 404). To block it at nginx as well, uncomment:
#
# location ^~ /sentinel/dashboard { return 404; }
# location ^~ /sentinel/v1/dashboard { return 404; }

# ---------------------------------------------------------------------------------------------------------
# ALTERNATIVE: the existing nginx itself runs INSIDE a Docker container (not the default assumption)
# ---------------------------------------------------------------------------------------------------------
# 127.0.0.1 then means "that nginx container", not the VM. Options, least to most invasive:
#   1. Preferred: keep this file as is and run nginx on the host (the usual `apt` install). Nothing to do.
#   2. proxy_pass to the host through the docker bridge gateway, and let the api bind that address:
#        - find it:  docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}'   (usually 172.17.0.1)
#        - in /opt/sentinel/.env.prod:  SENTINEL_BIND_ADDR=172.17.0.1   (compose then publishes 172.17.0.1:8100;
#          it is still not reachable from the internet, only from containers/host)
#        - re-run install.sh, then use:  proxy_pass http://172.17.0.1:8100/;
#        - if the container needs it, add `extra_hosts: ["host.docker.internal:host-gateway"]` to THAT nginx
#          service and use http://host.docker.internal:8100/ (this edits the neighbour's compose: avoid if you can).
#      Caveat: on Linux, ufw/iptables may block container -> host traffic on 8100; allow it from the docker subnet only.
#   Never publish 8100 on 0.0.0.0, and never attach the api to the neighbour's Docker network.
